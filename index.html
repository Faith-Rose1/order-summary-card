<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary</title>
  <link rel="icon" href="images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main>
    <article class="card">
      <img src="images/illustration-hero.svg" alt="" aria-hidden="true">

      <div class="card__content">
        <div class="card__summary">
          <h1>Order Summary</h1>
    
          <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
            device anywhere you like!
          </p>
        </div>

        <div class="card__annual-plan">
          <div class="card__plan">
            <img src="images/icon-music.svg" alt="" aria-hidden="true">

            <div class="card__plan-amount">
              <p>Annual Plan</p>

              <span>$59.99/year</span>
            </div>
          </div>

          <button type="button">Change</button>
        </div>

        <button type="button" class="card__proceed-btn">Proceed to Payment</button>

        <button type="button" class="card__cancel-btn">Cancel Order</button>
      </div>
    </article>
  </main>
</body>
</html>
